<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Thursday Social administration">
    <title>Admin | Thursday Social Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="./admin.css">
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <section id="login-view" class="admin-card" aria-labelledby="login-title">
        <p class="admin-kicker">Thursday Social Club</p>
        <h1 id="login-title">Admin</h1>
        <p class="admin-intro">Sign in to access the admin area.</p>

        <form id="login-form" class="signup-form">
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required
            >
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit">Sign in</button>
          <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
        </form>

      </section>

      <section
        id="admin-view"
        class="admin-card admin-dashboard"
        aria-labelledby="admin-title"
        hidden
      >
        <div class="admin-header">
          <div>
            <p class="admin-kicker">Thursday Social Club</p>
            <h1 id="admin-title">Admin</h1>
          </div>
          <button id="sign-out" class="secondary-button" type="button">Sign out</button>
        </div>

        <p class="admin-intro">View the current Thursday Social audience.</p>
        <div class="subscriber-count" aria-labelledby="subscriber-count-title">
          <h2 id="subscriber-count-title">Active subscribers</h2>
          <strong id="active-count" class="count-value" aria-live="polite">—</strong>
          <p id="count-status" class="count-status" role="status" aria-live="polite">
            Loading subscriber count…
          </p>
        </div>
      </section>
    </main>

    <script src="../config.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"
      integrity="sha384-tmLe+My/drouBT8LDBDX54/GtvpwceGWUwRKXHJfWra2DlJ/598zVtizduWyMqz5"
      crossorigin="anonymous"
    ></script>
    <script src="./admin.js"></script>
  </body>
</html>
